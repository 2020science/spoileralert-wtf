<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpoilerAlert.wtf — Reader</title>

  <meta name="description" content="A styled reader for SpoilerAlert.wtf content pages. Renders the site's markdown files in the Films from the Future aesthetic.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://spoileralert.wtf/viewer.html">

  <!-- Open Graph -->
  <meta property="og:site_name" content="The Moviegoer's Guide to the Future">
  <meta property="og:type" content="website">
  <meta property="og:title" content="SpoilerAlert.wtf — Reader">
  <meta property="og:description" content="A styled reader for SpoilerAlert.wtf content pages.">
  <meta property="og:url" content="https://spoileralert.wtf/viewer.html">
  <meta property="og:image" content="https://spoileralert.wtf/favicons/og-image.png">

  <!-- Twitter card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="SpoilerAlert.wtf — Reader">
  <meta name="twitter:description" content="A styled reader for SpoilerAlert.wtf content pages.">
  <meta name="twitter:image" content="https://spoileralert.wtf/favicons/og-image.png">

  <!-- Favicons (match the main spoileralert.wtf site) -->
  <link rel="icon" href="/favicons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="512x512" href="/favicons/favicon-512x512.png">
  <link rel="icon" type="image/png" sizes="256x256" href="/favicons/favicon-256x256.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicons/favicon-192x192.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicons/favicon-96x96.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16-optimized.png">
  <link rel="icon" media="(prefers-color-scheme: dark)" href="/favicons/favicon-dark-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon-180x180.png">
  <link rel="mask-icon" href="/favicons/safari-pinned-tab.svg" color="#000000">
  <link rel="manifest" href="/favicons/site.webmanifest">

  <meta name="theme-color" content="#ffffff">
  <meta name="msapplication-TileColor" content="#ffffff">
  <meta name="msapplication-TileImage" content="/favicons/mstile-150x150.png">
  <style>
    :root {
      --bg: #fafafa;
      --fg: #1a1a1a;
      --fg-muted: #555;
      --fg-dim: #888;
      --rule: #ddd;
      --accent: #3a6ea5;
      --accent-hover: #2a5484;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: 'Courier New', Courier, monospace;
      background: var(--bg);
      color: var(--fg);
      font-size: 14px;
      line-height: 1.6;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(250, 250, 250, 0.95);
      backdrop-filter: saturate(140%) blur(4px);
      -webkit-backdrop-filter: saturate(140%) blur(4px);
      border-bottom: 1px solid var(--rule);
      padding: 10px 22px;
      display: flex;
      gap: 14px;
      align-items: center;
      font-size: 12px;
    }
    .topbar a {
      color: var(--fg);
      text-decoration: none;
      border-bottom: 1px solid var(--fg-dim);
    }
    .topbar a:hover { border-bottom-color: var(--fg); }
    .topbar .spacer { flex: 1; }
    .topbar .slug {
      color: var(--fg-dim);
      font-size: 11px;
    }

    main {
      max-width: 740px;
      margin: 0 auto;
      padding: 40px 22px 80px;
    }
    main h1, main h2, main h3, main h4 {
      font-family: 'Courier New', Courier, monospace;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }
    main h1 { font-size: 26px; margin: 0 0 6px; }
    main h2 { font-size: 20px; margin: 2em 0 0.5em; border-bottom: 1px solid var(--rule); padding-bottom: 4px; }
    main h3 { font-size: 15px; margin: 1.6em 0 0.4em; color: var(--fg); letter-spacing: 0.02em; }
    main h4 { font-size: 13px; margin: 1.4em 0 0.3em; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.06em; }
    main p {
      margin: 0 0 1em;
      color: #222;
    }
    main a {
      color: var(--fg);
      text-decoration: none;
      border-bottom: 1px solid var(--fg-dim);
    }
    main a:hover { border-bottom-color: var(--fg); color: var(--accent-hover); }
    main a.internal-link { color: var(--accent); border-bottom-color: var(--accent); }
    main a.internal-link:hover { color: var(--accent-hover); border-bottom-color: var(--accent-hover); }

    main ul, main ol { margin: 0 0 1em; padding-left: 1.3em; }
    main li { margin: 0.3em 0; color: #222; }
    main blockquote {
      margin: 1em 0;
      padding: 0.2em 1em;
      border-left: 3px solid var(--rule);
      color: var(--fg-muted);
      font-style: italic;
    }
    main code {
      font-family: 'Courier New', Courier, monospace;
      background: #f0f0f0;
      padding: 1px 4px;
      font-size: 0.95em;
      border-radius: 2px;
    }
    main pre {
      background: #f0f0f0;
      padding: 12px;
      overflow-x: auto;
      border-radius: 2px;
    }
    main pre code { background: none; padding: 0; }
    main hr {
      border: 0;
      border-top: 1px solid var(--rule);
      margin: 2em 0;
    }
    main img { max-width: 100%; height: auto; }

    .viewer-meta {
      font-size: 11px;
      color: var(--fg-dim);
      margin: 4px 0 0 0;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .viewer-note {
      font-size: 12px;
      color: var(--fg-muted);
      background: #f5f5f0;
      border-left: 2px solid var(--rule);
      padding: 8px 12px;
      margin: 10px 0 28px 0;
      border-radius: 0 2px 2px 0;
      line-height: 1.5;
    }
    .viewer-note strong { color: var(--fg); }
    .status {
      color: var(--fg-muted);
      font-size: 13px;
      text-align: center;
      margin: 3em 0;
    }
    .status.error { color: #a33; }
    .picker {
      max-width: 640px;
      margin: 60px auto;
      padding: 30px 22px;
      text-align: center;
    }
    .picker h1 { font-size: 22px; margin: 0 0 10px; }
    .picker p { color: var(--fg-muted); }
    .picker ul { list-style: none; padding: 0; margin: 20px 0; }
    .picker li { margin: 6px 0; }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="/contents.html">← Contents</a>
    <span class="spacer"></span>
    <span class="slug" id="slug-label"></span>
    <a id="raw-link" href="#" target="_blank" rel="noopener">Open raw ↗</a>
  </div>

  <main id="main">
    <div class="status" id="status">Loading…</div>
  </main>

  <script src="https://unpkg.com/marked@12.0.0/marked.min.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const slug = (params.get('slug') || '').trim();
      const main = document.getElementById('main');
      const statusEl = document.getElementById('status');
      const slugLabel = document.getElementById('slug-label');
      const rawLink = document.getElementById('raw-link');

      if (!slug) {
        main.innerHTML = `
          <div class="picker">
            <h1>SpoilerAlert.wtf — Reader</h1>
            <p>This page renders any SpoilerAlert.wtf content page in a clean reader view. Open it with a slug in the URL — for example <code>?slug=ch01_in_the_beginning</code> — or pick one of the starting points below.</p>
            <ul>
              <li><a href="?slug=usage_guidance">Usage guidance</a></li>
              <li><a href="?slug=about_the_author">About the author</a></li>
              <li><a href="?slug=thematic_index">Thematic index</a></li>
              <li><a href="?slug=ch01_in_the_beginning">Chapter 1: In the Beginning</a></li>
              <li><a href="/contents.html">← Back to Contents</a></li>
            </ul>
          </div>
        `;
        document.title = 'SpoilerAlert.wtf — Reader';
        slugLabel.textContent = '';
        rawLink.style.visibility = 'hidden';
        return;
      }

      // Security: only allow slugs that look like our canonical basenames.
      if (!/^[A-Za-z0-9_\-]+$/.test(slug)) {
        main.innerHTML = `<div class="status error">Invalid slug: ${escapeHtml(slug)}</div>`;
        return;
      }

      const mdUrl = `https://spoileralert.wtf/md-files/${slug}.md`;
      const htmlUrl = `https://spoileralert.wtf/html-files/${slug}.html`;
      slugLabel.textContent = slug;
      rawLink.href = mdUrl;

      fetch(mdUrl, { mode: 'cors' })
        .then(r => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.text();
        })
        .then(text => render(text))
        .catch(err => {
          statusEl.className = 'status error';
          statusEl.innerHTML = `
            Couldn't load <code>${escapeHtml(slug)}</code> from spoileralert.wtf.<br>
            <small>${escapeHtml(err.message)}</small><br><br>
            <a href="${htmlUrl}" target="_blank" rel="noopener">Try the raw html-files version ↗</a>
          `;
        });

      function render(markdown) {
        const html = marked.parse(markdown, { breaks: false, gfm: true });
        main.innerHTML = html;

        // Derive page title from the first heading.
        const firstHeading = main.querySelector('h1, h2');
        if (firstHeading) {
          document.title = `${firstHeading.textContent.trim()} — SpoilerAlert.wtf`;
        }

        // Meta strip right under the first heading, followed by a note
        // reminding human readers that the underlying source is LLM-facing.
        if (firstHeading && firstHeading.parentNode === main) {
          const meta = document.createElement('div');
          meta.className = 'viewer-meta';
          meta.textContent = `spoileralert.wtf  ·  ${slug}`;
          firstHeading.insertAdjacentElement('afterend', meta);

          const note = document.createElement('div');
          note.className = 'viewer-note';
          note.innerHTML = "<strong>A note for human readers:</strong> this page is part of SpoilerAlert.wtf's AI-readable knowledge base — written primarily for language models and rendered here for human eyes. Structure and phrasing may feel a little more indexed than narrative.";
          meta.insertAdjacentElement('afterend', note);
        }

        // Rewrite internal links so navigation stays inside the viewer.
        main.querySelectorAll('a[href]').forEach(a => {
          const href = a.getAttribute('href') || '';
          const mdMatch  = href.match(/^https?:\/\/spoileralert\.wtf\/md-files\/([A-Za-z0-9_\-]+)\.md(?:#.*)?$/);
          const htmlMatch = href.match(/^https?:\/\/spoileralert\.wtf\/html-files\/([A-Za-z0-9_\-]+)\.html(?:#.*)?$/);
          if (mdMatch) {
            a.href = `/viewer.html?slug=${mdMatch[1]}`;
            a.classList.add('internal-link');
            a.removeAttribute('target');
          } else if (htmlMatch) {
            a.href = `/viewer.html?slug=${htmlMatch[1]}`;
            a.classList.add('internal-link');
            a.removeAttribute('target');
          } else if (/^https?:/i.test(href)) {
            a.target = '_blank';
            a.rel = 'noopener';
          }
        });

        window.scrollTo(0, 0);
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
        }[c]));
      }
    })();
  </script>
</body>
</html>
